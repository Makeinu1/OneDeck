name: OneDeck preview byte diagnostics

on:
  push:
    branches: [deploy/onedeck-play]
    paths: ['.github/workflows/onedeck-preview-byte-diagnostics.yml']

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Inspect immutable preview response bytes without credentials
        run: |
          node --input-type=module <<'JS'
          import https from 'node:https';
          import { createHash } from 'node:crypto';

          const url = 'https://d97af944.onedeck-play.pages.dev/assets/engine_wasm_bg-COcklXzW.wasm';
          const expectedRaw = '5ea69f06350ab0dba5a52ca51d7263d1efb5c97cdfb3866aa97861c90748c5e6';
          const expectedGzip = '8d2ac23bc5fb545008cfa5c47f2ae3de5f12af8fc055e75b69e4c4251f211b0f';

          function rawGet(acceptEncoding) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: {'Accept-Encoding': acceptEncoding}}, r => {
                const chunks = [];
                r.on('data', c => chunks.push(c));
                r.on('end', () => {
                  const body = Buffer.concat(chunks);
                  resolve({
                    status: r.statusCode,
                    headers: r.headers,
                    bytes: body.length,
                    sha256: createHash('sha256').update(body).digest('hex'),
                    first8: body.subarray(0, 8).toString('hex'),
                  });
                });
              }).on('error', reject);
            });
          }

          for (const enc of ['identity', 'gzip']) {
            const r = await rawGet(enc);
            console.log('HTTPS', enc, JSON.stringify(r));
          }

          const f = await fetch(url, {cache: 'no-store'});
          const body = Buffer.from(await f.arrayBuffer());
          console.log('FETCH', JSON.stringify({
            status: f.status,
            contentType: f.headers.get('content-type'),
            contentEncoding: f.headers.get('content-encoding'),
            contentLength: f.headers.get('content-length'),
            bytes: body.length,
            sha256: createHash('sha256').update(body).digest('hex'),
            first8: body.subarray(0,8).toString('hex'),
            expectedRaw,
            expectedGzip,
          }));
          JS
