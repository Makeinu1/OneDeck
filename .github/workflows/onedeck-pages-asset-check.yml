name: OneDeck Pages asset check

on:
  push:
    branches: [deploy/onedeck-play]
    paths: ['.github/workflows/onedeck-pages-asset-check.yml']

permissions:
  contents: read

jobs:
  preview-check:
    if: github.repository == 'Makeinu1/OneDeck' && github.ref == 'refs/heads/deploy/onedeck-play'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prepare bounded compression probes
        shell: python
        run: |
          import json, pathlib
          root = pathlib.Path('asset-check')
          root.mkdir()
          payload = json.dumps({'kind': 'onedeck-asset-check', 'value': 'a' * (26 * 1024 * 1024)}).encode()
          (root / 'probe.json').write_bytes(payload)
          (root / 'probe.wasm').write_bytes(b'\x00asm\x01\x00\x00\x00')
          (root / 'index.html').write_text('<!doctype html><title>OneDeck deployment asset check</title><p>Temporary deployment validation only. No game or credentials.</p>')
          (root / '_headers').write_text('/*\n  X-Robots-Tag: noindex\n')
      - name: Package with the same gateway as the real build
        run: python scripts/onedeck-publish/pack_assets.py asset-check --threshold 1
      - name: Publish only to an isolated preview branch
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          npx --yes wrangler@4.113.0 pages deploy asset-check
          --project-name=onedeck-play --branch=onedeck-asset-check
          --commit-hash="$GITHUB_SHA" --commit-dirty=true
      - name: Check decoding, streaming WASM, HEAD, ETag, and method rejection
        run: |
          node --input-type=module <<'JS'
          const base = 'https://onedeck-asset-check.onedeck-play.pages.dev';
          let last;
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              const r = await fetch(`${base}/probe.json`, {signal: AbortSignal.timeout(30000)});
              if (!r.ok) throw new Error(`JSON status ${r.status}`);
              const j = await r.json();
              if (j.kind !== 'onedeck-asset-check' || j.value.length !== 26 * 1024 * 1024) throw new Error('Decoded JSON does not match');
              const w = await fetch(`${base}/probe.wasm`, {signal: AbortSignal.timeout(30000)});
              if (!w.ok) throw new Error(`WASM status ${w.status}`);
              await WebAssembly.instantiateStreaming(w);
              const h = await fetch(`${base}/probe.wasm`, {method: 'HEAD'});
              if (!h.ok || h.headers.get('content-type') !== 'application/wasm') throw new Error('HEAD failed');
              const cached = await fetch(`${base}/probe.wasm`, {headers: {'If-None-Match': h.headers.get('etag')}});
              if (cached.status !== 304) throw new Error('ETag failed');
              const rejected = await fetch(`${base}/probe.wasm`, {method: 'POST'});
              if (rejected.status !== 405) throw new Error('Method rejection failed');
              console.log('PASS: compressed JSON, streaming WASM, HEAD, ETag and method gate. Production unchanged.');
              last = null;
              break;
            } catch (e) { last = e; await new Promise(r => setTimeout(r, 3000)); }
          }
          if (last) throw last;
          JS
      - name: Inspect existing public site and lobby without authentication
        if: always()
        shell: python
        run: |
          import json, re, urllib.request
          for url in ['https://onedeck-play.pages.dev/setup', 'https://onedeck-preview-lobby.makeinu1.workers.dev/health']:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      text = response.read(65536).decode('utf-8', errors='replace')
                      print('Public URL:', url, 'HTTP:', response.status, 'Content-Type:', response.headers.get('Content-Type'))
                      if url.endswith('/health'):
                          data = json.loads(text)
                          print({key: data.get(key) for key in ['status', 'protocol_version', 'lobby_protocol_version', 'version']})
                      else:
                          print('Title:', re.findall(r'<title>(.*?)</title>', text))
                          print('Script assets:', re.findall(r'<script[^>]+src="([^"]+)"', text))
              except Exception as error:
                  print('Public inspection unavailable:', type(error).__name__)
